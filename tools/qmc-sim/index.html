<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quine-McCluskey Simulator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" data-i18n="logicMinimization">Logic minimization</p>
          <h1 data-i18n="appTitle">Quine-McCluskey Simulator</h1>
        </div>
        <div class="topbar-actions">
          <label class="field language-field">
            <span data-i18n="language">Language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="it">Italiano</option>
            </select>
          </label>
          <button id="aboutButton" class="button ghost" type="button" data-icon="i" data-i18n="about">About</button>
        </div>
      </header>

      <section class="workspace">
        <section class="panel input-panel" aria-labelledby="truthTableTitle">
          <div class="panel-head">
            <div>
              <p class="eyebrow" data-i18n="truthTable">Truth table</p>
              <div class="section-title-row">
                <h2 id="truthTableTitle" data-i18n="outputValues">Output values</h2>
                <button class="help-button" type="button" data-help="truth" aria-label="Help for output values" title="Help for output values" data-i18n-attr="aria-label:truthHelpLabel;title:truthHelpLabel">?</button>
              </div>
            </div>
            <div class="button-row compact">
              <button id="clearTable" class="button ghost" type="button" data-icon="⌫" data-i18n="clear">Clear</button>
              <button id="loadExample" class="button ghost" type="button" data-icon="★" data-i18n="example">Example</button>
            </div>
          </div>

          <div class="truth-controls">
            <div class="bit-controls">
              <label class="field bits-field">
                <span data-i18n="inputBits">Input bits</span>
                <input id="bitCount" type="number" min="1" max="6" value="3">
              </label>
              <button id="applyBits" class="button primary" type="button" data-icon="✓" data-i18n="apply">Apply</button>
            </div>
            <div class="fill-controls" aria-label="Apply all outputs" data-i18n-attr="aria-label:applyAllOutputs">
              <button id="fillZeros" class="button ghost" type="button" data-icon="0" data-i18n="applyAllZero">All 0</button>
              <button id="fillOnes" class="button ghost" type="button" data-icon="1" data-i18n="applyAllOne">All 1</button>
            </div>
          </div>

          <div class="vector-line">
            <label class="field grow">
              <span data-i18n="outputVector">Output vector</span>
              <input id="vectorInput" type="text" spellcheck="false" autocomplete="off">
            </label>
            <button id="loadVector" class="button" type="button" data-icon="↵" data-i18n="load">Load</button>
          </div>

          <div class="table-wrap">
            <table class="truth-table">
              <thead>
                <tr>
                  <th>m</th>
                  <th data-i18n="input">Input</th>
                  <th>F</th>
                </tr>
              </thead>
              <tbody id="truthBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel method-panel" aria-labelledby="methodTitle">
          <div class="panel-head">
            <div>
              <p class="eyebrow" data-i18n="qmcProgression">QMC progression</p>
              <div class="section-title-row">
                <h2 id="methodTitle" data-i18n="combiningImplicants">Combining implicants</h2>
                <button class="help-button" type="button" data-help="method" aria-label="Help for combining implicants" title="Help for combining implicants" data-i18n-attr="aria-label:methodHelpLabel;title:methodHelpLabel">?</button>
              </div>
            </div>
            <button id="buildQmc" class="button primary" type="button" data-icon="⇄" data-i18n="buildMethod">Build method</button>
          </div>

          <div id="statusLine" class="status-line" data-i18n="initialStatus">Enter a truth table, then build the method.</div>

          <div id="stepControls" class="step-controls hidden">
            <button id="prevStep" class="icon-button" type="button" aria-label="Previous step" data-i18n-attr="aria-label:previousStep">‹</button>
            <div>
              <div id="stepTitle" class="step-title"></div>
              <div id="stepCount" class="step-count"></div>
            </div>
            <button id="nextStep" class="icon-button" type="button" aria-label="Next step" data-i18n-attr="aria-label:nextStep">›</button>
          </div>

          <div id="stepView" class="step-view empty-state">
            <div class="mini-diagram" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <p data-i18n="ready">Ready.</p>
          </div>
        </section>
      </section>

      <section id="chartPanel" class="panel chart-panel hidden" aria-labelledby="chartTitle">
        <div class="panel-head chart-head">
          <div>
            <p class="eyebrow" data-i18n="primeImplicantChart">Prime implicant chart</p>
            <div class="section-title-row">
              <h2 id="chartTitle" data-i18n="simplificationGuesses">Simplification guesses</h2>
              <button class="help-button" type="button" data-help="chart" aria-label="Help for simplification guesses" title="Help for simplification guesses" data-i18n-attr="aria-label:chartHelpLabel;title:chartHelpLabel">?</button>
            </div>
          </div>
          <div class="button-row compact">
            <button id="resetChart" class="button ghost" type="button" data-icon="↺" data-i18n="resetChart">Reset chart</button>
            <button id="checkStatus" class="button" type="button" data-icon="?" data-i18n="checkStatus">Check status</button>
            <button id="revealSolution" class="button" type="button" data-icon="!" data-i18n="revealSolution">Reveal solution</button>
            <button id="finishCoverage" class="button primary" type="button" data-icon="✓" data-i18n="finish">Finish</button>
          </div>
        </div>

        <div class="guess-bar">
          <div class="segmented" role="tablist" aria-label="Simplification type" data-i18n-attr="aria-label:simplificationType">
            <button class="mode-button active" data-mode="essential" type="button" data-icon="!" data-i18n="essential">Essential</button>
            <button class="mode-button" data-mode="row" type="button" data-icon="≡" data-i18n="rowDominance">Row dominance</button>
            <button class="mode-button" data-mode="column" type="button" data-icon="∥" data-i18n="columnDominance">Column dominance</button>
          </div>
          <div id="selectionText" class="selection-text" data-i18n="selectionEssentialEmpty">Select one implicant row.</div>
          <button id="applyGuess" class="button primary" type="button" data-icon="✓" data-i18n="applyGuess">Apply guess</button>
        </div>

        <div id="messageBox" class="message-box" data-i18n="noChartYet">No chart yet.</div>
        <div id="selectedBox" class="selected-box"></div>

        <div id="chartWrap" class="chart-wrap"></div>
        <div id="finalBox" class="final-box hidden"></div>
      </section>
    </main>

    <div class="info-modal hidden" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
      <div class="info-backdrop" data-modal-close></div>
      <section class="info-card">
        <button class="modal-close" type="button" data-modal-close aria-label="Close" data-i18n-attr="aria-label:close">×</button>
        <h2 id="infoModalTitle"></h2>
        <div id="infoModalBody" class="info-body"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
